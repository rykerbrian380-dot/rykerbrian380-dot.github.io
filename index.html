<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Brian's Lab</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 20%, rgba(0, 245, 255, 0.36), transparent 30%),
        radial-gradient(circle at 82% 75%, rgba(255, 43, 214, 0.34), transparent 32%),
        #080a14;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      background:
        conic-gradient(from 90deg, transparent, rgba(0, 245, 255, 0.24), transparent, rgba(255, 43, 214, 0.24), transparent);
      filter: blur(42px);
      animation: glow 10s infinite linear;
      z-index: -1;
    }

    .card {
      width: min(720px, 86vw);
      padding: 42px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 60px rgba(0, 245, 255, 0.25);
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 8vw, 86px);
      margin: 0;
      text-shadow: 0 0 24px #00f5ff;
      letter-spacing: 0;
    }

    p {
      font-size: 20px;
      color: #dbeafe;
      line-height: 1.6;
    }

    button {
      margin-top: 18px;
      padding: 14px 24px;
      border: 0;
      color: #07111f;
      background: #ff2bd6;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 28px #ff2bd6;
    }

    @keyframes glow {
      from {
        transform: rotate(0deg) scale(1);
      }

      to {
        transform: rotate(360deg) scale(1.12);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>My First Cool Website</h1>
    <p>This is my first glowing website, published with GitHub Pages.</p>
    <button onclick="changeText()">Launch</button>
  </main>

  <script>
    function changeText() {
      document.querySelector("p").textContent = "System launched. Welcome aboard.";
    }
  </script>
</body>
</html>
